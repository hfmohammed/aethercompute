[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-cpu",
    "crates/aether-gpu",
    "crates/aether-bench",
    "crates/aether-viewer",
    "crates/aether-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"
repository = "https://github.com/hfmohammed/aethercompute"

[workspace.dependencies]
wgpu = "30.0.1"
winit = "0.30"
pollster = "1"
bytemuck = { version = "1.25", features = ["derive"] }
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = "1"
rand = "0.9"
rand_chacha = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
approx = "0.5"
proptest = "1"
criterion = "0.5"
png = "0.17"

aether-core = { path = "crates/aether-core" }
aether-cpu = { path = "crates/aether-cpu" }
aether-gpu = { path = "crates/aether-gpu" }
aether-bench = { path = "crates/aether-bench" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
