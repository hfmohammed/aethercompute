name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p aether-cli --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/aether LICENSE README.md dist/
          tar -C dist -czf aether-${{ github.ref_name }}-${{ matrix.target }}.tar.gz .
      - uses: softprops/action-gh-release@v2
        with:
          files: aether-*.tar.gz
